<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumeet Elko - Ultra HD Mobile Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --blue: #1e3a8a; --accent: #3b82f6; --dark: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: #222; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header { background: var(--dark); color: white; padding: 10px; border-bottom: 2px solid var(--accent); z-index: 2000; text-align: center; }
        .btn-panel { display: flex; gap: 8px; overflow-x: auto; padding: 5px; scrollbar-width: none; justify-content: flex-start; }
        .btn-panel::-webkit-scrollbar { display: none; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 13px; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
        .btn-add { background: var(--accent); }
        .btn-pdf { background: #10b981; border: 2px solid #fff; }

        /* Main Workspace */
        .main-workspace { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        @media (min-width: 1024px) { .main-workspace { flex-direction: row; } }

        /* Sidebar - Smart Slider */
        .sidebar { 
            width: 100%; height: 110px; background: #1a1a1a; 
            border-bottom: 1px solid #444; overflow-x: auto; overflow-y: hidden; 
            display: flex; padding: 10px; gap: 15px; align-items: center;
        }
        @media (min-width: 1024px) {
            .sidebar { width: 220px; height: 100%; flex-direction: column; border-bottom: none; border-right: 1px solid #444; overflow-y: auto; }
        }

        .thumb-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
        .thumb-box { width: 130px; height: 75px; background: #fff; border: 2px solid #444; cursor: pointer; overflow: hidden; position: relative; }
        .thumb-box.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-num { color: #aaa; font-size: 12px; font-weight: bold; }

        /* Editor Area */
        .editor { flex: 1; background: #333; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        #container { transform-origin: top center; transition: 0.2s; padding-bottom: 100px; }
        
        /* Fixed Slide Resolution */
        .slide {
            width: 960px; height: 540px; background-image: url('./bg.jpg'); 
            background-size: 100% 100%; background-repeat: no-repeat;
            background-color: white; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.7);
            flex-shrink: 0; margin-bottom: 80px; color: #000; overflow: hidden;
        }

        /* Title Area Fix - Better Alignment */
        .intro-area { 
            position: absolute; left: 70px; top: 180px; width: 600px; 
            text-align: left; padding: 10px; border-radius: 8px;
        }
        .main-t { 
            font-family: 'Impact', sans-serif; font-size: 75px; color: var(--blue); 
            outline: none; text-transform: uppercase; line-height: 1.0; margin: 0;
            display: block; width: 100%; word-break: break-word;
        }
        .sub-t { font-size: 26px; font-weight: bold; color: #333; margin-top: 15px; outline: none; }

        .photo-grid { display: flex; width: 88%; height: 62%; gap: 20px; position: absolute; top: 115px; left: 6%; }
        .photo-item { flex: 1; height: 100%; border: 6px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.3); position: relative; background: #eee; cursor: grab; }
        .photo-item img { width: 100%; height: 100%; object-fit: fill; pointer-events: none; }

        .text-overlay { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.85); color: white; padding: 8px 18px; font-size: 22px; border-radius: 4px; font-weight: bold; display: none; z-index: 10; }
        
        .label-modal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 25px; border-radius: 15px; display: none; 
            flex-direction: column; gap: 15px; z-index: 5000; border: 3px solid var(--accent);
        }
        .select-btn { background: #111; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 20px; cursor: pointer; }

        .slide-ctrl, .photo-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 100; }
        .mini-btn { font-size: 14px; padding: 10px 16px; background: rgba(0,0,0,0.85); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; z-index: 9999; justify-content: center; align-items: center; font-size: 22px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">🚀 Ultra HD PDF तयार होत आहे... <br> कृपया १ मिनिट थांबा.</div>

<div class="header">
    <div class="btn-panel">
        <input type="file" id="files" accept="image/*" multiple style="display:none" onchange="addPhotoSlides()">
        <button class="btn btn-add" onclick="document.getElementById('files').click()">📷 Generate Report</button>
        <button class="btn btn-add" style="background:#f59e0b" onclick="addIntro()">📄 Add Intro</button>
        <button class="btn btn-pdf" onclick="downloadUltraHD()">📥 Download HD PDF</button>
    </div>
</div>

<div class="main-workspace">
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor">
        <div id="container"></div>
    </div>
</div>

<script>
    const container = document.getElementById('container');
    const sidebar = document.getElementById('sidebar');

    function adjustScale() {
        const editorWidth = document.getElementById('editor').clientWidth - 40;
        const scale = editorWidth < 960 ? editorWidth / 960 : 1;
        container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', adjustScale);

    new Sortable(sidebar, {
        animation: 150,
        onEnd: () => {
            const thumbs = document.querySelectorAll('.thumb-box');
            thumbs.forEach(t => container.appendChild(document.getElementById(t.dataset.id)));
            updateSlideNumbers();
        }
    });

    window.onload = () => { addIntro(); adjustScale(); };

    function updateSlideNumbers() {
        document.querySelectorAll('.thumb-wrapper').forEach((w, i) => w.querySelector('.thumb-num').innerText = i + 1);
    }

    function addIntro() {
        const id = 's-' + Date.now();
        const div = document.createElement('div');
        div.className = 'slide'; div.id = id;
        div.innerHTML = `
            <div class="slide-ctrl"><button class="mini-btn" style="background:red" onclick="removeSlide('${id}')">X</button></div>
            <div class="intro-area">
                <div class="main-t" contenteditable="true" spellcheck="false">DEEP CLEANING DRIVE</div>
                <div class="sub-t" contenteditable="true" spellcheck="false">Maintaining Hygiene, Ensuring Safety</div>
            </div>
        `;
        container.appendChild(div);
        createThumb(id, null);
        adjustScale();
    }

    function createThumb(id, imgData) {
        const w = document.createElement('div'); w.className = 'thumb-wrapper';
        w.innerHTML = `<div class="thumb-box" data-id="${id}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth',block:'center'})">${imgData ? `<img src="${imgData}">` : '<div style="font-size:10px; padding:20px; text-align:center;">TITLE</div>'}</div><div class="thumb-num"></div>`;
        sidebar.appendChild(w);
        updateSlideNumbers();
    }

    async function addPhotoSlides() {
        const files = Array.from(document.getElementById('files').files);
        for (let i = 0; i < files.length; i += 2) {
            const id = 's-' + Date.now() + i;
            const div = document.createElement('div');
            div.className = 'slide'; div.id = id;
            const grid = document.createElement('div'); grid.className = 'photo-grid';
            const imgData = await loadImg(files[i], grid, id);
            if (files[i+1]) await loadImg(files[i+1], grid, id);
            div.innerHTML = `<div class="slide-ctrl"><button class="mini-btn" style="background:red" onclick="removeSlide('${id}')">X</button></div>`;
            div.appendChild(grid); container.appendChild(div);
            createThumb(id, imgData);
            new Sortable(grid, { group: 'photos', animation: 200 });
        }
        adjustScale();
    }

    function loadImg(f, p, sid) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => {
                const item = document.createElement('div'); item.className = 'photo-item';
                item.innerHTML = `<img src="${e.target.result}"><div class="text-overlay">BEFORE</div>
                    <div class="label-modal">
                        <button class="select-btn" onclick="setLabel(this,'BEFORE')">BEFORE</button>
                        <button class="select-btn" onclick="setLabel(this,'AFTER')">AFTER</button>
                        <button class="select-btn" style="background:orange" onclick="setLabel(this,'')">CLEAR LABEL</button>
                        <button class="select-btn" style="background:red" onclick="this.parentElement.style.display='none'">CLOSE</button>
                    </div>
                    <div class="photo-actions">
                        <button class="mini-btn" onclick="changeImg(this)">🔄 Change</button>
                        <button class="mini-btn" onclick="this.closest('.photo-item').querySelector('.label-modal').style.display='flex'">LABEL</button>
                    </div>`;
                p.appendChild(item); res(e.target.result);
            }; r.readAsDataURL(f);
        });
    }

    function changeImg(btn) {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = e => {
            const r = new FileReader();
            r.onload = ev => btn.closest('.photo-item').querySelector('img').src = ev.target.result;
            r.readAsDataURL(e.target.files[0]);
        };
        inp.click();
    }

    function setLabel(btn, txt) {
        const o = btn.closest('.photo-item').querySelector('.text-overlay');
        o.innerText = txt; o.style.display = txt ? 'block' : 'none';
        btn.parentElement.style.display = 'none';
    }

    function removeSlide(id) {
        document.getElementById(id).remove();
        document.querySelector(`[data-id="${id}"]`).closest('.thumb-wrapper').remove();
        updateSlideNumbers();
    }

    async function downloadUltraHD() {
        const slides = document.querySelectorAll('.slide'); if(!slides.length) return;
        document.getElementById('loader').style.display = 'flex';
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'px', [960, 540]);

        for (let i = 0; i < slides.length; i++) {
            slides[i].querySelectorAll('.slide-ctrl, .photo-actions, .label-modal').forEach(el => el.style.visibility = 'hidden');
            
            // Ultra HD Scale: 4
            const canvas = await html2canvas(slides[i], { 
                scale: 4, 
                useCORS: true, 
                logging: false,
                allowTaint: true
            });
            
            slides[i].querySelectorAll('.slide-ctrl, .photo-actions, .label-modal').forEach(el => el.style.visibility = 'visible');

            if (i > 0) doc.addPage();
            doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 960, 540);
        }
        
        doc.save(`HD_Report_${Date.now()}.pdf`);
        document.getElementById('loader').style.display = 'none';
    }
</script>
</body>
</html>
